name: Regenerate pnpm lockfile
on:
  push:
    branches:
      - fix/hp-003-security-review-2
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Regenerate lockfile with pinned pnpm
        run: pnpm install --force --lockfile-only
      - name: Commit regenerated lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already compatible; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: regenerate pnpm 11 lockfile'
          git push origin HEAD:fix/hp-003-security-review-2
