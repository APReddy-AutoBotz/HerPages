name: Non-sensitive bug report
description: Report a reproducible issue using synthetic data only.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities use SECURITY.md, not this public form. Never attach private Pages, child records, recovery material or identity documents."
  - type: input
    id: version
    attributes:
      label: Commit/build and environment
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps with synthetic fixtures
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized test evidence and related IDs
